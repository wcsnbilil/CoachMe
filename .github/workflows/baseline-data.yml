name: 回归基准数据

on:
  pull_request:
    paths:
      - .github/workflows/baseline-data.yml
      - tools/baseline/pack_golfdb.py
      - tools/baseline/pack_phases.py
      - tools/baseline/pack_negatives.py
      - tools/baseline/push_data.sh
      - tools/benchmark/golfdb_eval.py
      - tools/benchmark/swingnet_mil.py
      - CoachMe/Resources/SwingNet*/**
      - tools/e2e/golfdb_reuse_app_run.txt
  workflow_dispatch:

concurrency:
  group: baseline-data
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pack:
    name: 打包 GolfDB 400 的 App 关键点
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: source
        run: echo "run=$(tr -d '[:space:]' < tools/e2e/golfdb_reuse_app_run.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: golfdb-app-landmarks
          path: golfdb-app
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
      - name: 打包
        run: |
          pip install --quiet numpy pandas
          curl -fsSL -o golfDB.pkl https://raw.githubusercontent.com/wmcnally/golfdb/master/data/golfDB.pkl
          python tools/baseline/pack_golfdb.py golfdb-app golfDB.pkl --limit 400 \
            --source-run "${{ steps.source.outputs.run }}" --out packed/golfdb400 | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la packed/golfdb400
          sha256sum packed/golfdb400/* | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 推到 baseline-data 分支
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/baseline/push_data.sh packed/golfdb400 "GolfDB 400 App 关键点（来源 run ${{ steps.source.outputs.run }}，打包于 ${{ github.sha }}）"

  phases:
    name: 打包 GolfDB split 1 的 SwingNet 逐帧概率
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: GolfDB（缓存）
        uses: actions/cache@v4
        with:
          path: golfdb
          key: golfdb-videos160-v1-${{ runner.os }}
      - name: 下载 GolfDB（缓存未命中时；只在本次运行里用，不上传）
        run: |
          if [ ! -f golfdb/data/golfDB.pkl ]; then
            pip3 install --quiet gdown
            mkdir -p golfdb/data
            python3 -m gdown 1uBwRxFxW04EqG87VCoX3l6vXeV5T5JYJ -O golfdb/videos_160.zip
            unzip -q golfdb/videos_160.zip -d golfdb/data/
            rm golfdb/videos_160.zip
            curl -fsSL -o golfdb/data/golfDB.pkl https://raw.githubusercontent.com/wmcnally/golfdb/master/data/golfDB.pkl
          fi
      - name: SwingNet（App 打包的模型，numpy 后端）跑 split 1
        run: |
          pip install --quiet opencv-python-headless numpy pandas coremltools
          python tools/benchmark/golfdb_eval.py --golfdb golfdb/data --backend numpy --split 1 \
            --save-probs probs --out golfdb_split1.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 打包
        run: |
          python tools/baseline/pack_phases.py probs golfdb/data/golfDB.pkl --split 1 \
            --out packed/golfdb-split1-phases | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la packed/golfdb-split1-phases
          sha256sum packed/golfdb-split1-phases/* | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 推到 baseline-data 分支
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/baseline/push_data.sh packed/golfdb-split1-phases "GolfDB split 1 SwingNet 逐帧概率（打包于 ${{ github.sha }}）"

  negatives:
    name: 打包「不是一次完整挥杆」的 SwingNet 逐帧概率（从 GolfDB split 1 剪出）
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: GolfDB（缓存）
        uses: actions/cache@v4
        with:
          path: golfdb
          key: golfdb-videos160-v1-${{ runner.os }}
      - name: 下载 GolfDB（缓存未命中时；只在本次运行里用，不上传）
        run: |
          if [ ! -f golfdb/data/golfDB.pkl ]; then
            pip3 install --quiet gdown
            mkdir -p golfdb/data
            python3 -m gdown 1uBwRxFxW04EqG87VCoX3l6vXeV5T5JYJ -O golfdb/videos_160.zip
            unzip -q golfdb/videos_160.zip -d golfdb/data/
            rm golfdb/videos_160.zip
            curl -fsSL -o golfdb/data/golfDB.pkl https://raw.githubusercontent.com/wmcnally/golfdb/master/data/golfDB.pkl
          fi
      - name: SwingNet（App 打包的模型，numpy 后端）跑剪出来的片段，并打包
        run: |
          pip install --quiet opencv-python-headless numpy pandas coremltools
          python tools/baseline/pack_negatives.py golfdb/data --split 1 \
            --out packed/golfdb-split1-negatives | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la packed/golfdb-split1-negatives
          sha256sum packed/golfdb-split1-negatives/* | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 推到 baseline-data 分支
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/baseline/push_data.sh packed/golfdb-split1-negatives "GolfDB split 1 剪出的非完整挥杆逐帧概率（打包于 ${{ github.sha }}）"
