# ClubheadDB（CC BY-NC 4.0）还能复现多少，以及现有杆头原型对它的人工标注有多准。
# 视频和帧只在这台临时机器和本仓库的 Actions 缓存里（缓存不能从网页下载）；不上传 artifact，不推任何分支。
name: ClubheadDB 杆头评测

on:
  workflow_dispatch:

concurrency:
  group: clubhead-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: 复现 ClubheadDB + 评测现有杆头原型
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: 依赖（姿态和阶段：MediaPipe 0.10.21 要 NumPy 1）
        run: |
          pip install --quiet clubhead-db==1.0.1 yt-dlp "pyarrow<20" pandas mediapipe==0.10.21 "opencv-python-headless<4.12" "numpy<2" coremltools
          python -c "import pyarrow, mediapipe, cv2, numpy; print(numpy.__version__, cv2.__version__)"
          bash tools/download-model.sh heavy
      - name: 依赖（杆头原型：ultralytics SAM 2，单独的环境）
        run: |
          python -m venv "$RUNNER_TEMP/sam"
          "$RUNNER_TEMP/sam/bin/pip" install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/sam/bin/pip" install --quiet ultralytics opencv-python-headless
          "$RUNNER_TEMP/sam/bin/python" -c "import ultralytics, cv2, numpy; print(ultralytics.__version__, numpy.__version__)"
      # Reddit 的签名链接会过期：对齐过的帧缓存起来，之后的运行不再依赖下载。
      - name: 对齐过的帧（缓存）
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clubheaddb_aligned
          key: clubheaddb-aligned-v1
      - name: 复现探查
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python tools/club/clubheaddb_probe.py --work "$RUNNER_TEMP/clubheaddb" --keep "$RUNNER_TEMP/clubheaddb_aligned" --summary "$RUNNER_TEMP/probe.md"
          cat "$RUNNER_TEMP/probe.md" >> "$GITHUB_STEP_SUMMARY"
      - name: 评测现有杆头原型
        run: |
          ls "$RUNNER_TEMP/clubheaddb_aligned"
          python tools/club/clubheaddb_eval.py --frames "$RUNNER_TEMP/clubheaddb_aligned" --work "$RUNNER_TEMP/eval" --club-python "$RUNNER_TEMP/sam/bin/python" --summary "$RUNNER_TEMP/eval.md"
          cat "$RUNNER_TEMP/eval.md" >> "$GITHUB_STEP_SUMMARY"

  train:
    name: 自训杆头检测器（测试 ${{ matrix.holdout }}）
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        holdout: ["swing_035,swing_037", "swing_036,swing_048,swing_063", "swing_040,swing_062"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 依赖
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet ultralytics clubhead-db==1.0.1 pyarrow pandas
      - name: 对齐过的帧（缓存，由上面的评测 job 建立）
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/clubheaddb_aligned
          key: clubheaddb-aligned-v1
          fail-on-cache-miss: true
      - name: 训练并在留出的球手上评测
        run: |
          python tools/club/clubheaddb_train.py --frames "$RUNNER_TEMP/clubheaddb_aligned" --holdout "${{ matrix.holdout }}" --work "$RUNNER_TEMP/fold" --summary "$RUNNER_TEMP/fold.md"
          cat "$RUNNER_TEMP/fold.md" >> "$GITHUB_STEP_SUMMARY"
