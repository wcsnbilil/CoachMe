# App 流水线在 GolfDB 上的基准：App 自己的解码 + MediaPipe（内测设置，只检测 1 人）出关键点，
# 阶段用 GolfDB 标注，判定用同一套算法（Swift/Python 已逐段一致），算 P0 三项并和 Python 并排。
# GolfDB 视频运行时从官方 Google Drive 下载，不进仓库、不上传为 artifact（只上传关键点和结果）。
name: GolfDB App 基准

on:
  pull_request:
    paths:
      - .github/workflows/golfdb-app.yml
      - CoachMe/Services/**
      - CoachMeTests/GolfDBAppPipelineTests.swift
      - tools/e2e/golfdb_*.py
      - tools/benchmark/impact_check.py
      - tools/split/swing_split.py
  workflow_dispatch:
    inputs:
      limit:
        description: GolfDB 沿目标线前 N 段
        default: "400"

concurrency:
  group: golfdb-${{ github.ref }}
  cancel-in-progress: true

env:
  LIMIT: ${{ github.event.inputs.limit || '400' }}

jobs:
  app:
    name: App 流水线出关键点（模拟器）
    runs-on: macos-15
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: GolfDB（缓存）
        uses: actions/cache@v4
        with:
          path: golfdb
          key: golfdb-videos160-v1-${{ runner.os }}
      - name: 下载 GolfDB（缓存未命中时）
        run: |
          if [ ! -f golfdb/data/golfDB.pkl ]; then
            pip3 install --quiet --break-system-packages gdown 2>/dev/null || pip3 install --quiet gdown
            mkdir -p golfdb/data
            python3 -m gdown 1uBwRxFxW04EqG87VCoX3l6vXeV5T5JYJ -O golfdb/videos_160.zip
            unzip -q golfdb/videos_160.zip -d golfdb/data/
            rm golfdb/videos_160.zip
            curl -fsSL -o golfdb/data/golfDB.pkl https://raw.githubusercontent.com/wmcnally/golfdb/master/data/golfDB.pkl
          fi
          ls golfdb/data | head; ls golfdb/data/videos_160 | wc -l
      - name: 选片
        run: |
          pip3 install --quiet --break-system-packages pandas 2>/dev/null || pip3 install --quiet pandas
          python3 tools/e2e/golfdb_prepare.py golfdb/data --limit "$LIMIT" --out golfdb-clips
      - run: brew install xcodegen
      - run: bash tools/download-model.sh heavy
      - run: |
          xcodegen generate
          pod install --repo-update
      - name: 选模拟器
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          c = [x for k, v in devs.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          print(c[-1]["udid"])')
          echo "SIM=$UDID" >> "$GITHUB_ENV"
      - name: App 跑 GolfDB
        timeout-minutes: 290
        run: |
          set -o pipefail
          TEST_RUNNER_COACHME_GOLFDB_DIR="$PWD/golfdb-clips" \
          TEST_RUNNER_COACHME_GOLFDB_OUT="$PWD/golfdb-app" \
          xcodebuild test \
            -workspace CoachMe.xcworkspace -scheme CoachMe \
            -destination "id=$SIM" \
            -only-testing:CoachMeTests/GolfDBAppPipelineTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log | grep -E "error:|GOLFDB|Test Case .*(passed|failed)|\*\* (BUILD|TEST)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golfdb-app-landmarks
          path: golfdb-app/

  python:
    name: Python 流水线（对照）
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: GolfDB（缓存）
        uses: actions/cache@v4
        with:
          path: golfdb
          key: golfdb-videos160-v1-${{ runner.os }}
      - name: 下载 GolfDB（缓存未命中时）
        run: |
          if [ ! -f golfdb/data/golfDB.pkl ]; then
            pip3 install --quiet --break-system-packages gdown 2>/dev/null || pip3 install --quiet gdown
            mkdir -p golfdb/data
            python3 -m gdown 1uBwRxFxW04EqG87VCoX3l6vXeV5T5JYJ -O golfdb/videos_160.zip
            unzip -q golfdb/videos_160.zip -d golfdb/data/
            rm golfdb/videos_160.zip
            curl -fsSL -o golfdb/data/golfDB.pkl https://raw.githubusercontent.com/wmcnally/golfdb/master/data/golfDB.pkl
          fi
          ls golfdb/data | head; ls golfdb/data/videos_160 | wc -l
      - run: |
          pip install --quiet mediapipe==0.10.21 opencv-python-headless numpy pandas coremltools
          bash tools/download-model.sh heavy
      - name: run_path（GolfDB 标注阶段）
        run: python tools/faults/run_path.py --golfdb golfdb/data --limit "$LIMIT" --out report_py | tail -5
      - name: 击球帧交叉核对（SwingNet / 双手高度规则 / 混合），自动阶段下的 P0
        run: |
          python tools/benchmark/impact_check.py --golfdb golfdb/data --limit "$LIMIT" \
            --landmarks report_py/landmarks --out impact | tee -a "$GITHUB_STEP_SUMMARY"
          for m in swingnet hybrid; do
            echo; echo "### 自动阶段（$m）"
            python tools/e2e/golfdb_app_metrics.py report impact/results_$m.json --holdout-from 200 || true
          done | sed 's/App 流水线/Python（自动阶段）/' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: golfdb-python
          path: |
            report_py/results.json
            impact/

  report:
    name: P0 三项（App vs Python）
    needs: [app, python]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: GolfDB（缓存）
        uses: actions/cache@v4
        with:
          path: golfdb
          key: golfdb-videos160-v1-${{ runner.os }}
      - name: 下载 GolfDB（缓存未命中时）
        run: |
          if [ ! -f golfdb/data/golfDB.pkl ]; then
            pip3 install --quiet --break-system-packages gdown 2>/dev/null || pip3 install --quiet gdown
            mkdir -p golfdb/data
            python3 -m gdown 1uBwRxFxW04EqG87VCoX3l6vXeV5T5JYJ -O golfdb/videos_160.zip
            unzip -q golfdb/videos_160.zip -d golfdb/data/
            rm golfdb/videos_160.zip
            curl -fsSL -o golfdb/data/golfDB.pkl https://raw.githubusercontent.com/wmcnally/golfdb/master/data/golfDB.pkl
          fi
          ls golfdb/data | head; ls golfdb/data/videos_160 | wc -l
      - uses: actions/download-artifact@v4
        with:
          name: golfdb-app-landmarks
          path: golfdb-app
      - uses: actions/download-artifact@v4
        with:
          name: golfdb-python
          path: report_py
        continue-on-error: true
      - name: App 关键点 → 同一套判定
        run: |
          pip install --quiet mediapipe==0.10.21 opencv-python-headless numpy pandas
          python tools/e2e/golfdb_app_metrics.py cache golfdb-app report_app
          # 只算 App 跑完的那些段（--cached-only：没有关键点缓存的段跳过，不会跑 Python MediaPipe）
          python tools/faults/run_path.py --golfdb golfdb/data --limit "$LIMIT" --out report_app --cached-only | tail -3
      - name: 写入 job summary
        run: |
          python tools/e2e/golfdb_app_metrics.py report report_app/results.json report_py/results.json \
            --holdout-from 200 | tee -a "$GITHUB_STEP_SUMMARY"
