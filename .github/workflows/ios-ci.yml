# 云端 Mac 自动编译 + 测试（GitHub 免费 macOS runner；公开仓库不计分钟）。
#
# TestFlight 上传在 testflight.yml（写好但未启用，等 Apple 开发者账号）。
name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: CoachMeCore 测试 + Swift/Python 一致性
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python 合成测试（tools/faults）
        run: |
          pip install --quiet numpy
          python tools/faults/test_path_fault.py
      - name: 用当前 Python 重算一致性对照数据
        run: |
          FIX=tools/faults/fixtures/path_parity.json
          if [ -f "$FIX" ]; then
            python tools/faults/refresh_parity.py "$FIX" --out "$RUNNER_TEMP/path_parity.json"
            echo "COACHME_PATH_PARITY=$RUNNER_TEMP/path_parity.json" >> "$GITHUB_ENV"
          else
            echo "::warning::没有 $FIX，SwingPathParityTests 会被跳过"
          fi
      - name: 内测版代码不引用 AI / 指标 / 3D 小人 / 骨架回放的界面
        run: |
          BANNED='ChatPanelView|AISettingsView|WorkbenchView|[^a-zA-Z]ReportView|AngleChartView|RuleListView|Skeleton3DView|SkeletonOverlay|VideoPlayerView|GolfAvatar|LLMChatService|AISettingsStore'
          if grep -nE "$BANNED" CoachMe/Features/Beta/*.swift; then
            echo "::error::内测版页面引用了不该可达的界面"; exit 1
          fi
          echo "内测版页面没有引用 AI、关节指标、3D 小人或骨架回放"
      - name: swift test
        run: |
          set -o pipefail
          swift --version
          swift test --package-path CoachMeCore 2>&1 | tee swift-test.log
      - name: 测试统计
        if: always()
        run: |
          {
            echo "### CoachMeCore"
            grep -E "Executed [0-9]+ tests" swift-test.log | tail -1
            grep -E "SwingPathParityTests.*(passed|failed|skipped)" swift-test.log | tail -2
          } | tee -a "$GITHUB_STEP_SUMMARY" || true

  app:
    name: App 编译 + 模拟器测试（不签名）
    runs-on: macos-15
    permissions:
      contents: write   # 只用来把截图推到 ci-screenshots 分支
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 安装 XcodeGen
        run: brew install xcodegen
      - name: 下载 MediaPipe 模型
        run: bash tools/download-model.sh heavy
      - name: xcodegen + pod install
        run: |
          xcodebuild -version
          xcodegen generate
          pod install --repo-update
      - name: 选模拟器
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          c = [x for k, v in devs.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          print(c[-1]["udid"])')
          echo "SIM=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$UDID"
      - name: xcodebuild test
        run: |
          set -o pipefail
          mkdir -p "$PWD/screenshots"
          TEST_RUNNER_COACHME_SCREENSHOT_DIR="$PWD/screenshots" \
          xcodebuild test \
            -workspace CoachMe.xcworkspace -scheme CoachMe \
            -destination "id=$SIM" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*CoachMe|Test Case .*(passed|failed|skipped)|Executed|\*\* (BUILD|TEST)"
      - name: 测试统计
        if: always()
        run: |
          {
            echo "### App (simulator)"
            grep -E "Executed [0-9]+ tests" xcodebuild.log | tail -1
            grep -E "Test Case .*failed" xcodebuild.log | head -20
          } | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: 截图推到 ci-screenshots 分支（不用下载 zip，手机上就能看）
        if: always() && hashFiles('screenshots/*.png') != ''
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -e
          DIR="${REF_NAME//\//-}"
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf "$RUNNER_TEMP/shots" && mkdir -p "$RUNNER_TEMP/shots" && cd "$RUNNER_TEMP/shots"
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin ci-screenshots; then git checkout -q -b ci-screenshots FETCH_HEAD; else git checkout -q --orphan ci-screenshots; fi
          rm -rf "$DIR" && mkdir -p "$DIR"
          cp "$GITHUB_WORKSPACE"/screenshots/*.png "$DIR/"
          {
            echo "# $REF_NAME @ ${SHA:0:7}"
            for f in "$DIR"/*.png; do n=$(basename "$f"); echo; echo "## $n"; echo "<img src=\"$n\" width=\"300\">"; done
          } > "$DIR/README.md"
          git add -A "$DIR"
          git commit -q -m "screenshots: $REF_NAME ${SHA:0:7}" || true
          git push -q origin ci-screenshots
          URL="https://github.com/${{ github.repository }}/tree/ci-screenshots/$DIR"
          echo "### 内测版截图" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "截图：$URL"
      - name: 内测版界面截图（中英，zip）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-logs
          path: |
            xcodebuild.log
            TestResults.xcresult
