name: Lint

on:
  push:
    branches-ignore: [baseline-data, ci-screenshots]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  swiftlint:
    name: SwiftLint 规则 + 阈值字面量
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ghcr.io/realm/swiftlint:0.59.1
    steps:
      - name: git 和 python
        run: apt-get update -qq && apt-get install -y -qq git python3
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 生成的阈值文件是最新的
        run: python3 tools/thresholds/generate.py --check
      - name: 规则自测
        run: tools/lint/selftest.sh
      - name: 工作流都开了 pipefail
        run: |
          tools/ci/selftest_workflows.sh
          python3 tools/ci/check_workflows.py
      - name: SwiftLint
        run: tools/lint/run.sh
      - name: 基线只许变小
        if: github.ref != 'refs/heads/main'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/lint/check_baseline.py "origin/${{ github.base_ref || 'main' }}"
