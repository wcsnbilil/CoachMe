name: 回归基准

on:
  push:
    branches-ignore: [baseline-data, ci-screenshots]
  pull_request:
  workflow_dispatch:

concurrency:
  group: regression-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  swing-path:
    name: 外下/内下：GolfDB 400 快照 + 一致率不下降
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet numpy
      - name: 区间的逐单元数据和三个门槛指标对得上
        run: python tools/baseline/test_uncertainty.py
      - name: 逐杆判定与快照一致
        run: python tools/baseline/regress.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 一致率不低于基线分支
        if: github.ref != 'refs/heads/main'
        run: python tools/baseline/regress.py --against "origin/${{ github.base_ref || 'main' }}" | tee -a "$GITHUB_STEP_SUMMARY"

  phases:
    name: 7 阶段：GolfDB split 1 快照 + 准确率不下降
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet numpy
      - name: 逐段关键帧与快照一致
        run: python tools/baseline/regress_phases.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 准确率不低于基线分支
        if: github.ref != 'refs/heads/main'
        run: python tools/baseline/regress_phases.py --against "origin/${{ github.base_ref || 'main' }}" | tee -a "$GITHUB_STEP_SUMMARY"

  keyframes:
    name: 关键帧 → 外下/内下：识别关键帧与标注关键帧的判定一致率不下降
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet numpy
      - name: 逐段判定与快照一致
        run: python tools/baseline/regress_keyframes.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 一致率不低于基线分支
        if: github.ref != 'refs/heads/main'
        run: python tools/baseline/regress_keyframes.py --against "origin/${{ github.base_ref || 'main' }}" | tee -a "$GITHUB_STEP_SUMMARY"
