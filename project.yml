# XcodeGen specification for CoachMe.
#
# WHY THIS FILE EXISTS: the project was authored on Windows, where Xcode cannot
# run. A hand-written .xcodeproj is a large, order-sensitive binary-ish plist
# that is very easy to corrupt blind. This spec is plain text, reviewable, and
# regenerates a correct project on the Mac with one command.
#
# On the Mac:
#   brew install xcodegen
#   xcodegen generate
#   pod install
#   open CoachMe.xcworkspace        # NOT the .xcodeproj — CocoaPods needs the workspace
#
# See docs/MAC_SETUP.md for the full sequence including the model download.

name: CoachMe
options:
  bundleIdPrefix: com.coachme
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # 由 tools/setup-device-signing.sh 写入
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal   # untested build; tighten once it compiles on a Mac

packages:
  CoachMeCore:
    path: CoachMeCore

targets:
  CoachMe:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CoachMe
        excludes:
          - "**/.DS_Store"
          # The .task model is added explicitly below as a resource so it lands
          # in Copy Bundle Resources rather than being guessed at by file type.
          - "Resources/*.task"
      - path: CoachMe/Resources
        includes:
          - "*.task"
        buildPhase: resources
        optional: true
    dependencies:
      - package: CoachMeCore
        product: CoachMeCore
    info:
      path: CoachMe/Resources/Info.plist
      properties:
        CFBundleDisplayName: CoachMe
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Only the permissions actually used. CoachMe reads a video the user
        # picks; it does not need write access or the camera in version 1.
        NSPhotoLibraryUsageDescription: "CoachMe 需要读取相册中的挥杆视频，用于本机分析。视频不会上传。"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coachme.app
        TARGETED_DEVICE_FAMILY: "1"    # iPhone only in v1
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault

  CoachMeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - CoachMeTests
    dependencies:
      - target: CoachMe
      - package: CoachMeCore
        product: CoachMeCore
    settings:
      base:
        # Without this the test bundle has no Info.plist and code signing for the
        # simulator fails with "Cannot code sign because the target does not have
        # an Info.plist file". The app target supplies its own plist; the test
        # bundle has no reason to, so let Xcode synthesise one.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CoachMe:
    build:
      targets:
        CoachMe: all
        CoachMeTests: [test]
    test:
      targets:
        - CoachMeTests
      gatherCoverageData: true
